<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!--
      ┌─────────────────────────────────────────────────────────┐
      │  CONTENT SECURITY POLICY — Government-Grade Hardening   │
      │  Zero third-party connections. All resources self-hosted.│
      └─────────────────────────────────────────────────────────┘
      script-src 'self' allows Vite-compiled chunks only.
      style-src 'unsafe-inline' required for Tailwind JIT output.
      img-src data: allows inline SVG favicon via data URI.
      connect-src 'self' blocks all XHR/fetch to third parties.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self';" />

    <!-- Viewport — mobile-first, prevents user-scale issues on outdoor use -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme & display -->
    <meta name="theme-color" content="#14532d" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pickleball" />

    <!-- SEO -->
    <title>Pickleball Scorekeeper — Offline PWA</title>
    <meta name="description"
      content="Free, offline-first pickleball scorekeeper with strict game rules, server tracking, court positions, undo, and localStorage persistence. No ads, no tracking." />
    <meta name="keywords" content="pickleball, scorekeeper, score tracker, offline, PWA, serve tracking" />
    <meta name="author" content="Pickleball Scorekeeper" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dylangrow.github.io/PickleBall/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pickleball Scorekeeper" />
    <meta property="og:description" content="Offline-first pickleball score tracker with strict game rules and server tracking." />
    <meta property="og:url" content="https://dylangrow.github.io/PickleBall/" />
    <meta property="og:image" content="https://dylangrow.github.io/PickleBall/icons/icon-512.svg" />

    <!--
      ┌──────────────────────────────────────────────────────────┐
      │  FAVICON STACK — Inline SVG prevents 404 network requests│
      │  No external font or image fetches.                      │
      └──────────────────────────────────────────────────────────┘
    -->
    <!-- Primary: inline SVG data-URI (zero network) -->
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2316a34a'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%23052e16' stroke-width='1'/%3E%3Cpath d='M16 8 C12 8 8 12 8 16' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 8 C20 8 24 12 24 16' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 16 C8 20 12 24 16 24' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M24 16 C24 20 20 24 16 24' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E" />

    <!-- PWA manifest — vite-plugin-pwa injects this at build time -->
    <link rel="manifest" href="/PickleBall/manifest.webmanifest" />

    <!-- Apple touch icon fallback from public dir -->
    <link rel="apple-touch-icon" href="/PickleBall/icons/icon-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
